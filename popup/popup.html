<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AccessBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-frame">
    <!-- Header -->
    <header class="popup-header">
      <h1 class="popup-title">AccessBridge</h1>
    </header>

    <main class="popup-main">
      <!-- Row 1: Main On/Off Switch -->
      <section class="popup-card" aria-label="Main site control">
        <label class="switch-row" for="site-toggle">
          <span class="switch-title" id="site-toggle-label">AccessBridge is ON for this site</span>
          <span class="switch-container">
            <input type="checkbox" 
                   id="site-toggle" 
                   class="power-switch-input" 
                   role="switch" 
                   checked 
                   aria-checked="true"
                   aria-labelledby="site-toggle-label">
            <span class="power-switch-track" aria-hidden="true">
              <span class="power-switch-thumb"></span>
            </span>
          </span>
        </label>
      </section>

      <!-- Row 2: Fixes Summary -->
      <section class="popup-card summary-card" id="summary-card" aria-live="polite">
        <p class="summary-line" id="summary-line">Nothing to fix on this page</p>
        <ul class="fixes-list" id="fixes-list" aria-label="Fixes on this page">
          <li class="fix-line" id="fix-line-names" hidden>Added names to 0 buttons and images</li>
          <li class="fix-line" id="fix-line-keyboard" hidden>Made 0 items usable with the keyboard</li>
          <li class="fix-line" id="fix-line-text" hidden>Fixed 0 areas that cut off enlarged text</li>
        </ul>
      </section>

      <!-- Row 3: Highlight Fixes Toggle -->
      <section class="popup-card" aria-label="Highlight fixes">
        <label class="switch-row" for="toggle-highlights">
          <div class="switch-text-group">
            <span class="switch-title">Highlight fixes</span>
            <span class="switch-helper">Outline what AccessBridge changed</span>
          </div>
          <span class="switch-container">
            <input type="checkbox" 
                   id="toggle-highlights" 
                   class="power-switch-input" 
                   role="switch" 
                   aria-checked="false"
                   aria-label="Highlight fixes">
            <span class="power-switch-track" aria-hidden="true">
              <span class="power-switch-thumb"></span>
            </span>
          </span>
        </label>
      </section>
    </main>

    <!-- Footer: Full Width More Settings Button -->
    <footer class="popup-footer">
      <button type="button" id="btn-more-settings" class="btn-more-settings">More settings</button>
    </footer>

    <!-- Screen Reader Announcer -->
    <div id="popup-announcer" class="sr-only" aria-live="polite"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
